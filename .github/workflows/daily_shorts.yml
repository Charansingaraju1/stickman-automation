name: Daily Automated YouTube Shorts

on:
  schedule:
    # 3 Peak US Viral Slots (Aligned with YouTube Studio Analytics):
    # Slot 1 (Secondary Lunch Window): 12:00 PM EST = 5:00 PM UTC
    - cron: '0 17 * * *'
    # Slot 2 (Primary Peak US Commute/Evening): 2:30 PM EST = 7:30 PM UTC
    - cron: '30 19 * * *'
    # Slot 3 (Evening Wind-Down): 6:30 PM EST = 10:30 PM UTC
    - cron: '30 22 * * *'
  workflow_dispatch: # Allows manual 1-click trigger anytime from GitHub UI

jobs:
  upload_short:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Decode YouTube Secrets
        run: |
          echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > token.json
          echo '${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}' > client_secret.json

      - name: Publish Next Short in Queue
        run: python upload_to_youtube.py

      - name: Commit Updated Upload History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add uploaded_history.json || true
          git commit -m "chore: record published short in queue [skip ci]" || echo "No changes to commit"
          git push || echo "Push skipped"
