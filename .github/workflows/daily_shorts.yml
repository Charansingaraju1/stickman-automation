name: Daily Automated YouTube Shorts

on:
  schedule:
    # 2 peak US uploads/day aligned with top channel window (15:00 & 22:00 UTC = 10:00 AM & 5:00 PM EST)
    - cron: '0 15 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch: # Allows manual 1-click trigger anytime from GitHub UI

jobs:
  upload_short:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Decode YouTube Secrets
        run: |
          echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > token.json
          echo '${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}' > client_secret.json

      - name: Publish Next Short on YouTube
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ vars.AUTO_PUBLISH_ENABLED }}" = "true" ]; then
            python upload_to_youtube.py
          else
            python upload_to_youtube.py --dry-run
          fi

      - name: Cross-Post Next Reel on Instagram (@stick_man_nation)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID || '17841451949000745' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ vars.AUTO_PUBLISH_ENABLED }}" = "true" ]; then
            python upload_to_instagram.py
          else
            python upload_to_instagram.py --dry-run
          fi

      - name: Commit Updated Upload History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add uploaded_history.json ig_uploaded_history.json || true
          git commit -m "chore: record published short in queue [skip ci]" || echo "No changes to commit"
          git push || echo "Push skipped"
