name: Daily Automated YouTube Shorts

on:
  schedule:
    # Daily Peak US Viral Slot (Aligned with YouTube Studio Analytics Primary Window: 2:00-4:00 PM EST):
    # 1 upload/day prevents feed cannibalization & keeps multi-day queues stocked automatically
    - cron: '30 19 * * *' # 2:30 PM EST = 1:00 AM IST next day
  workflow_dispatch: # Allows manual 1-click trigger anytime from GitHub UI

jobs:
  upload_short:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Decode YouTube Secrets
        run: |
          echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > token.json
          echo '${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}' > client_secret.json

      - name: Publish Next Short in Queue
        run: python upload_to_youtube.py

      - name: Commit Updated Upload History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add uploaded_history.json || true
          git commit -m "chore: record published short in queue [skip ci]" || echo "No changes to commit"
          git push || echo "Push skipped"
