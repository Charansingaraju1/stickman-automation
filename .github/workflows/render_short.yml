name: Automated Cloud Video Renderer 🎬

on:
  workflow_dispatch:
    inputs:
      short_id:
        description: 'Short key to render in cloud'
        required: true
        default: 'qtip_ear'
        type: choice
        options:
          - qtip_ear
          - fish_bone
          - mentos_cola

jobs:
  render_video:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (ffmpeg & fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation

      - name: Install Python Dependencies
        run: pip install edge-tts numpy

      - name: Render Short in Cloud
        run: python renderers/short_builder.py --short "${{ github.event.inputs.short_id }}"

      - name: Commit Rendered Video Asset
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add videos/*.mp4 || true
          git commit -m "feat(cloud-render): publish newly rendered short [skip ci]" || echo "No changes to commit"
          git push || echo "Push skipped"
