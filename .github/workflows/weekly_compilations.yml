name: Weekly 16:9 Watch-Hour Compilations ($0 Cloud)

on:
  schedule:
    # 3 long-form compilations/week (Mon, Wed, Fri at 18:00 UTC = 1:00 PM EST / 11:30 PM IST)
    - cron: '0 18 * * 1,3,5'
  workflow_dispatch:

jobs:
  publish_compilation:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python & Node
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install system deps & Chrome libs
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk-bridge2.0-0 libcups2 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 || sudo apt-get install -y ffmpeg libnss3 libatk-bridge2.0-0 libcups2 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2

      - name: Install Python & Node deps
        run: |
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2
          npm ci --no-audit --no-fund

      - name: Decode YouTube Secrets
        run: |
          echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > token.json
          echo '${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}' > client_secret.json

      - name: Build & Publish Weekly 16:9 Compilation + Thumbnail
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ vars.AUTO_PUBLISH_ENABLED }}" = "true" ]; then
            python renderers/compile_longform.py --publish
          else
            python renderers/compile_longform.py --dry-run
          fi

      - name: Commit Compilation History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add compilation_history.json || true
          git commit -m "chore: record weekly compilation upload [skip ci]" || echo "No changes"
          git push || echo "Push skipped"
